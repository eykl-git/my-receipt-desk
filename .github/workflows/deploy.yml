# Deploy the static site to GitHub Pages (design §16, brief §21, REQ-18.2).
# Separate from ci.yml. Before the first run, set Settings → Pages →
# Source to "GitHub Actions"; a workflow file cannot change that setting.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run waits instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - uses: actions/configure-pages@v6

      # The base path follows the repository name: a repo named
      # <owner>.github.io is served at "/", every other repo at "/<repo>/".
      # `npm run build` also runs `npm run ocr:assets` first.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
